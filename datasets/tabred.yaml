# Leakage-aware / temporal leg — TabReD (corpus T-B3).
#
# Role: axis-3 (data integrity) anchor and a second external-validity family
# under a TEMPORAL split. TabReD (Rubachev et al., ICLR 2025 Spotlight) supplies
# 8 industry-grade datasets with time-based train/val/test splits; under the
# temporal split the GBDT-over-DL margin shrinks, which is the leakage signal we
# carry into the leakage-aware comparison.
#
# Source: github.com/yandex-research/tabred (8 datasets; the canonical
# lowercase-hyphen tokens below match the TabReD release and the downstream
# temporal-shift codebases). TabReD ships the time-ordered split per dataset;
# topic_pipeline.load_split uses that split directly (it does NOT re-draw splits
# from a seed for this family — the temporal order is the point).
#
# Token convention: "tabred:<dataset_name>"  e.g. "tabred:sberbank-housing".

family: tabred
role: external_validity_temporal
data_root_env: TABRED_DATA_ROOT
loader: tabred_folder

# Only the temporal protocol applies; cv_standard/matched_hpo are dropped for
# this family by the runner (a random split would destroy the temporal signal).
protocols: [temporal]

protocol_note: >
  Use TabReD's provided time-based split (train = earliest, validation/test =
  later periods). Seeds vary only model initialisation / tuning, not the split.
  Classification scored by AUC (ROC), regression by RMSE on the released target
  (several targets are log-transformed, e.g. cooking-time, delivery-eta,
  maps-routing); keep the target on the TabReD scale for comparability.

protocol_params:
  split: tabred_temporal         # use the shipped temporal indices
  seed_affects: [model_init, hpo]  # not the split

preprocessing: talent_gorishniy_2021

# 8 datasets (3 binary classification, 5 regression). Feature counts noted
# because some exceed the TFM feature caps (maps-routing has ~1026 features >
# TabPFNv2's 500); topic_pipeline.get_predictions guards those units and records
# status="skipped_feature_cap" rather than crashing the batch.
datasets:
  # binary classification (3)
  - homesite-insurance     # ~296 feat,  260753 rows
  - ecom-offers            # ~119 feat,  160057 rows
  - homecredit-default     # ~696 feat,  381664 rows  (> TabPFNv2 500-feat cap)
  # regression (5)
  - sberbank-housing       # ~387 feat,   28321 rows
  - cooking-time           # ~195 feat,  319986 rows  (log target)
  - delivery-eta           # ~225 feat,  350516 rows  (log target)
  - maps-routing           # ~1026 feat, 279945 rows  (> TabPFNv2 500-feat cap; log target)
  - weather                # ~98 feat,   423795 rows
