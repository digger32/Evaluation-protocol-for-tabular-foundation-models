# proportional quota (largest remainder), lexicographic pool + fixed seed.
# emit_as makes every unit a plain core:<name> record: loaders,
# VALID_FAMILY_PROTOCOL and the analysis stage see the parent family;
# this file only narrows the CLI dataset axis for the matched_hpo leg.
